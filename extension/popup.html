<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lead Exporter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="logo">LE</div>
    <div>
      <h1>Lead Exporter</h1>
      <p class="subtitle">LinkedIn &amp; LeadLoft → CSV</p>
    </div>
  </header>

  <section id="status-section">
    <div id="status" class="status info">Scanning page...</div>
  </section>

  <section id="tables-section" hidden>
    <label class="field-label" for="table-select">Detected tables</label>
    <select id="table-select"></select>

    <div class="preview">
      <div class="preview-meta">
        <span id="row-count">0 rows</span>
        <span id="col-count">0 columns</span>
      </div>
      <div id="headers-preview" class="headers-preview"></div>
    </div>
  </section>

  <section id="columns-section" hidden>
    <details id="columns-details">
      <summary>
        <span>Columns to export</span>
        <span class="muted" id="columns-count">all</span>
      </summary>
      <div class="columns-actions">
        <button id="select-all" class="link-button" type="button">Select all</button>
        <span class="dot">·</span>
        <button id="select-none" class="link-button" type="button">Select none</button>
        <span class="dot">·</span>
        <button id="select-essential" class="link-button" type="button">Essentials only</button>
      </div>
      <div id="columns-list" class="columns-list"></div>
    </details>
  </section>

  <section id="options-section" hidden>
    <details>
      <summary>Options</summary>
      <div class="options-body">
        <label class="checkbox">
          <input type="checkbox" id="auto-scroll" />
          <span>Load all pages / scroll before export</span>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="include-hidden" />
          <span>Include hidden columns (if any)</span>
        </label>
        <label class="field-label" for="filename">Filename</label>
        <input type="text" id="filename" placeholder="leadloft-leads" />
      </div>
    </details>
  </section>

  <section id="actions">
    <button id="reload" class="secondary" type="button" title="Reloads the tab so the network hook captures API responses from scratch. Required on LinkedIn before scrolling.">Reload tab</button>
    <button id="rescan" class="secondary" type="button">Rescan</button>
    <button id="export" class="primary" type="button" disabled>Export CSV</button>
  </section>

  <footer>
    <span id="footer-hint">Tip: on LinkedIn, click "Reload tab" first, then scroll through results — the hook captures data as LinkedIn loads it.</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
