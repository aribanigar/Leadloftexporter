name: Keep Render API warm

# Pings the Render-hosted FastAPI every 10 minutes so the free-tier web
# service never spins down. Without this, the container sleeps after 15
# minutes of inactivity and the next request — typically a login from the
# CRM — takes 30-60 seconds to cold-start, which is longer than the
# frontend's HTTP timeout. Users see "can't log in".
#
# With this workflow active there is always a request in the last 10
# minutes, so the container stays warm and login is instant.
#
# Cost: zero. GitHub Actions free tier is 2,000 minutes/month for private
# repos and unlimited for public. This workflow uses ~6 seconds per run,
# 144 runs/day = ~14 min/day = ~7 hrs/month. Well under any limit.
#
# Override the API URL by setting a repository variable named API_URL
# (Settings → Secrets and variables → Actions → Variables → New). Default
# is the production Render URL from manifest.json.

on:
  schedule:
    # Every 10 minutes — well under Render's 15-min idle spin-down threshold,
    # giving headroom for GitHub Actions scheduler jitter (free tier can be
    # ~5-15 min late). Cron syntax is UTC.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Override API URL for this run only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render API to keep it warm
        run: |
          set -eu
          # Warm EVERY backend the app might be pointed at, so whichever URL the
          # CRM frontend / extension actually use stays awake. The previous
          # default (leadloftexporter-1.onrender.com) did NOT match the real
          # production backend the extension + app use (leadloftexporter.onrender.com),
          # so the container that actually serves login was spinning down and
          # cold-starting (30-60s) — that is the "CRM is slow to load" symptom.
          #
          # Order: manual-run input → repo variable API_URL → the known hosts.
          URLS="${{ github.event.inputs.url }} ${{ vars.API_URL }} https://leadloftexporter.onrender.com https://leadloftexporter-1.onrender.com"

          # One poke per URL is enough to WAKE the container (the request reaching
          # Render triggers the spin-up); we don't need to wait for the full cold
          # response. Bounded max-time keeps each run cheap on Actions minutes.
          seen=""
          for BASE in $URLS; do
            [ -z "$BASE" ] && continue
            BASE="${BASE%/}"
            case " $seen " in *" $BASE "*) continue;; esac   # dedup
            seen="$seen $BASE"
            START=$(date +%s)
            CODE=$(curl -sS -o /dev/null \
              -w "%{http_code}" \
              --max-time 75 \
              --connect-timeout 15 \
              --retry 0 \
              "$BASE/health" || echo "000")
            echo "[$BASE] HTTP $CODE in $(( $(date +%s) - START ))s"
          done
          # Never fail the run on a transient miss (would spam email); the next
          # scheduled run retries. Reaching the container is what matters.
          exit 0
