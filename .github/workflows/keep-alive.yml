name: Keep Render API warm

# Pings the backend every 10 minutes so the free-tier web service never
# spins down. Without this, the container sleeps after 15 minutes of
# inactivity and the next request — typically a login from the CRM — takes
# 30-60 seconds to cold-start, which is longer than the frontend's HTTP
# timeout. Users see "can't log in".
#
# IMPORTANT: this does NOT hardcode a Render hostname. The backend has
# moved between Render services more than once (leadloftexporter-1 →
# leadloftexporter → whatever's live now), and every time it did, every
# keep-alive mechanism with a hardcoded URL kept warming a dead service
# while the real one went uninvestigated cold. Instead this pings
# /api/cron/keep-alive on the FRONTEND (src/app/api/cron/keep-alive/route.ts),
# which is a stable URL that internally always reads NEXT_PUBLIC_API_URL —
# the same env var the frontend itself uses for every API call. Switching
# backends on Vercel is the only update ever needed; this workflow follows
# automatically.
#
# Cost: zero. GitHub Actions free tier is 2,000 minutes/month for private
# repos and unlimited for public. This workflow uses ~6 seconds per run,
# 144 runs/day = ~14 min/day = ~7 hrs/month. Well under any limit.
#
# Override the frontend URL by setting a repository variable named
# FRONTEND_URL (Settings → Secrets and variables → Actions → Variables).

on:
  schedule:
    # Every 10 minutes — well under Render's 15-min idle spin-down threshold,
    # giving headroom for GitHub Actions scheduler jitter (free tier can be
    # ~5-15 min late). Cron syntax is UTC.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Override the frontend base URL for this run only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the frontend's keep-alive proxy (follows NEXT_PUBLIC_API_URL)
        env:
          DEFAULT_FRONTEND: https://leads.hudace.com
        run: |
          set -eu
          VAR_URL="${{ vars.FRONTEND_URL }}"
          INPUT_URL="${{ github.event.inputs.url }}"
          FRONTEND="${INPUT_URL:-${VAR_URL:-$DEFAULT_FRONTEND}}"
          FRONTEND="${FRONTEND%/}"
          URL="$FRONTEND/api/cron/keep-alive"

          # This one request does two things: reaching the Vercel function
          # keeps IT warm, and the function's own body then pings the actual
          # backend's /health, which is what wakes Render up.
          BODY=$(curl -sS -m 75 --connect-timeout 15 "$URL" || echo '{"ok":false,"error":"curl_failed"}')
          echo "[$URL] $BODY"
          # Never fail the run on a transient miss (would spam email); the next
          # scheduled run retries. Reaching the container is what matters.
          exit 0
