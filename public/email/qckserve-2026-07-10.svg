<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="QckServe — Monsoon is your busy season. List your service free. Zero fees.">
  <defs>
    <style>
      .serif  { font-family: Georgia, 'Times New Roman', serif; }
      .sans   { font-family: 'Poppins', 'Arial Narrow', Arial, sans-serif; }
    </style>
  </defs>

  <!-- base -->
  <rect width="1080" height="1350" fill="#1A1A1A"/>

  <!-- top-left logo zone: left blank (~140px), Ariba places logo manually -->
  <rect x="72" y="64" width="140" height="140" fill="none"/>

  <!-- kicker: italic serif for editorial contrast -->
  <text x="230" y="150" class="serif" font-style="italic" font-size="34" fill="#FF6B00">The monsoon rush is here</text>
  <line x1="230" y1="176" x2="1008" y2="176" stroke="#3A3A3A" stroke-width="2"/>

  <!-- oversized caps headline -->
  <text x="70" y="380" class="sans" font-size="150" font-weight="800" letter-spacing="-4" fill="#FFFFFF">MONSOON</text>
  <text x="70" y="530" class="sans" font-size="150" font-weight="800" letter-spacing="-4" fill="#FFFFFF">IS YOUR</text>
  <text x="70" y="680" class="sans" font-size="150" font-weight="800" letter-spacing="-4" fill="#FF6B00">BUSY SEASON</text>

  <!-- flat orange band with the free hook -->
  <rect x="0" y="760" width="1080" height="300" fill="#ef6723"/>
  <text x="70" y="900" class="serif" font-style="italic" font-size="40" fill="#1A1A1A">Repairs are booming. Get found for</text>
  <text x="62" y="1030" class="sans" font-size="200" font-weight="800" letter-spacing="-6" fill="#1A1A1A">&#8377;0</text>
  <text x="470" y="960" class="sans" font-size="64" font-weight="800" letter-spacing="-1" fill="#FFFFFF">LISTING FEE.</text>
  <text x="470" y="1030" class="sans" font-size="64" font-weight="800" letter-spacing="-1" fill="#FFFFFF">ZERO COMMISSION.</text>

  <!-- 3 proof columns (editorial magazine) -->
  <text x="72"  y="1150" class="sans" font-size="30" font-weight="700" fill="#FF6B00">OWNER-DIRECT</text>
  <text x="72"  y="1188" class="serif" font-size="26" fill="#CFCFCF">customers call you</text>

  <text x="430" y="1150" class="sans" font-size="30" font-weight="700" fill="#FF6B00">NO MIDDLEMEN</text>
  <text x="430" y="1188" class="serif" font-size="26" fill="#CFCFCF">you keep every rupee</text>

  <text x="800" y="1150" class="sans" font-size="30" font-weight="700" fill="#FF6B00">LIVE IN 2 MIN</text>
  <text x="800" y="1188" class="serif" font-size="26" fill="#CFCFCF">list, get found, done</text>

  <line x1="72" y1="1230" x2="1008" y2="1230" stroke="#3A3A3A" stroke-width="2"/>

  <!-- footer -->
  <text x="72" y="1300" class="sans" font-size="42" font-weight="800" letter-spacing="-1" fill="#FFFFFF">qckserve.in</text>
  <text x="1008" y="1300" text-anchor="end" class="serif" font-style="italic" font-size="30" fill="#FF6B00">India&#8217;s free local marketplace</text>
</svg>
