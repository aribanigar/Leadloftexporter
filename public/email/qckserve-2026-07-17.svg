<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="QckServe: Monsoon means work. List every service you offer, free. Zero commission, owner-direct. qckserve.in">
  <defs>
    <style>
      .cap  { font-family: 'Arial Narrow','Helvetica Neue',Arial,sans-serif; font-weight: 800; letter-spacing: -2px; }
      .serif{ font-family: Georgia,'Times New Roman',serif; font-style: italic; }
      .sans { font-family: Arial,Helvetica,sans-serif; }
    </style>
  </defs>

  <!-- base: editorial dark -->
  <rect width="1200" height="1500" fill="#1A1A1A"/>

  <!-- flat colour block, no gradients: orange band lower third -->
  <rect x="0" y="1010" width="1200" height="490" fill="#ef6723"/>

  <!-- reserved ~140px top-left logo square (kept blank; logo placed manually) -->
  <!-- (60,60) -> (200,200) intentionally empty -->

  <!-- hairline top rule -->
  <rect x="90" y="250" width="1020" height="2" fill="#3a3a3a"/>
  <text x="90" y="228" class="sans" font-size="26" letter-spacing="8" fill="#ef6723">SERVICES · MONSOON 2026</text>

  <!-- italic-serif kicker for contrast -->
  <text x="88" y="360" class="serif" font-size="60" fill="#FCF9F8">When it rains, they search.</text>

  <!-- oversized caps headline -->
  <text x="82" y="530" class="cap" font-size="205" fill="#FFFFFF">MONSOON</text>
  <text x="82" y="710" class="cap" font-size="205" fill="#FFFFFF">MEANS</text>
  <text x="82" y="890" class="cap" font-size="205" fill="#ef6723">WORK.</text>

  <!-- supporting line -->
  <text x="90" y="965" class="sans" font-size="40" fill="#CFCFCF">List every service you offer — free.</text>

  <!-- the ONE memorable device: giant zero-commission -->
  <text x="88" y="1300" class="cap" font-size="360" fill="#1A1A1A">&#8377;0</text>
  <text x="640" y="1210" class="sans" font-weight="700" font-size="54" fill="#1A1A1A">commission.</text>
  <text x="640" y="1272" class="sans" font-weight="700" font-size="54" fill="#1A1A1A">no listing fee.</text>
  <text x="640" y="1334" class="serif" font-size="46" fill="#1A1A1A">owner-direct, always.</text>

  <!-- footer wordmark bottom-left -->
  <text x="90" y="1445" class="sans" font-weight="800" font-size="46" fill="#1A1A1A">qckserve.in</text>
  <text x="1110" y="1445" text-anchor="end" class="serif" font-size="34" fill="#1A1A1A">India's free local marketplace</text>
</svg>
