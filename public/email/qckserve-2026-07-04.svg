<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="QckServe — list your store free, keep 100% of every sale, 0% commission.">
  <defs>
    <style>
      .cap { font-family: 'Arial Narrow', Arial, sans-serif; font-weight: 800; letter-spacing: -1px; }
      .serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
      .sans { font-family: Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <!-- base -->
  <rect width="1080" height="1350" fill="#1A1A1A"/>

  <!-- top-left logo safe zone: ~140px square left blank (Ariba places logo manually) -->

  <!-- kicker, offset to clear the logo zone -->
  <text x="200" y="112" class="serif" font-size="34" fill="#FF6B00">for local shop owners</text>

  <!-- oversized headline -->
  <text x="72" y="300" class="cap" font-size="150" fill="#FCF9F8">KEEP</text>
  <text x="72" y="452" class="cap" font-size="150" fill="#FCF9F8">EVERY</text>
  <text x="72" y="604" class="cap" font-size="150" fill="#FF6B00">RUPEE.</text>

  <!-- price-strike device: what marketplaces quietly take vs QckServe -->
  <g transform="translate(72,720)">
    <text x="0" y="0" class="sans" font-size="34" fill="#8A8A8A">Marketplaces quietly take</text>
    <text x="0" y="92" class="cap" font-size="128" fill="#6B6B6B">30–45%</text>
    <line x1="-6" y1="52" x2="470" y2="52" stroke="#FF6B00" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- the ₹0 hero block -->
  <g transform="translate(0,900)">
    <rect x="0" y="0" width="1080" height="300" fill="#FF6B00"/>
    <text x="72" y="150" class="cap" font-size="230" fill="#1A1A1A">&#8377;0</text>
    <text x="560" y="118" class="cap" font-size="60" fill="#1A1A1A">COMMISSION.</text>
    <text x="560" y="182" class="cap" font-size="60" fill="#1A1A1A">FREE TO LIST.</text>
    <text x="560" y="246" class="cap" font-size="60" fill="#1A1A1A">OWNER-DIRECT.</text>
  </g>

  <!-- footer -->
  <text x="72" y="1285" class="cap" font-size="52" fill="#FCF9F8">qckserve.in</text>
  <text x="1008" y="1285" text-anchor="end" class="serif" font-size="30" fill="#FF6B00">list your store, free</text>
</svg>
