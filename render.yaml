services:
  - type: web
    name: leadcaptura-api
    runtime: docker
    repo: https://github.com/aribanigar/Leadloftexporter
    rootDir: api
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: leadcaptura-redis
          property: connectionString
      - key: FRONTEND_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-7
      - key: ANTHROPIC_FAST_MODEL
        value: claude-haiku-4-5
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REDIRECT_URI
        sync: false
      - key: SENTRY_DSN
        sync: false
      # WhatsApp sidecar — set these to point at the Node service below.
      # WA_SIDECAR_URL = https://leadcaptura-whatsapp.onrender.com
      # WA_SIDECAR_TOKEN must match the value on that service.
      - key: WA_SIDECAR_URL
        sync: false
      - key: WA_SIDECAR_TOKEN
        sync: false

  # ── WhatsApp sidecar ─────────────────────────────────────────────────────
  # Node/Baileys service that owns the actual WhatsApp Web connection.
  # The main API proxies /whatsapp-web/* to this service.
  # The persistent disk MUST live at /app/.baileys_auth so paired phones
  # survive container restarts.
  - type: web
    name: leadcaptura-whatsapp
    runtime: docker
    repo: https://github.com/aribanigar/Leadloftexporter
    rootDir: whatsapp
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: wa-sessions
      mountPath: /app/.baileys_auth
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8001"
      - key: WA_SIDECAR_TOKEN
        sync: false

  - type: worker
    name: leadcaptura-worker
    runtime: docker
    repo: https://github.com/aribanigar/Leadloftexporter
    rootDir: api
    plan: starter
    dockerCommand: celery -A app.workers.celery_app worker --loglevel=info
    autoDeploy: true
    envVars:
      - fromGroup: leadcaptura-api

  - type: worker
    name: leadcaptura-beat
    runtime: docker
    repo: https://github.com/aribanigar/Leadloftexporter
    rootDir: api
    plan: starter
    dockerCommand: celery -A app.workers.celery_app beat --loglevel=info
    autoDeploy: true
    envVars:
      - fromGroup: leadcaptura-api

  - type: redis
    name: leadcaptura-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
